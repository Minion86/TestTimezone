version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/backend/backend"
    schedule:
      interval: "weekly"
    groups:
      security-updates:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: "npm"
    directory: "/frontend/frontend"
    schedule:
      interval: "weekly"
    groups:
      security-updates:
        applies-to: security-updates
        patterns: ["*"]
